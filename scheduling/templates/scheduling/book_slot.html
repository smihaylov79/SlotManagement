{% extends "scheduling/base.html" %}
{% block content %}

<h2 class="mb-4">Book a Slot</h2>

<form id="dateForm" method="get" class="mb-4">
    <div class="row">
        <div class="col-md-4">
            <label class="form-label">Select Date</label>
            <input type="date" name="date" class="form-control" value="{{ date }}" id="dateInput">
        </div>
    </div>
</form>

<form method="post" class="card p-4 shadow-sm">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">Timeslot</label>
        <select name="slot" class="form-select">
            {% for s in slots %}
                <option value="{{ s.id }}">
                    {{ s.slot_time }} — {{ s.bookings.count }}/{{ capacity }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Truck Plate</label>
        <input type="text" name="truck_plate" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Number of Customers</label>
        <input type="number" name="customers" class="form-control" min="1" value="1" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Operation Type</label>
        <select name="operation_type" class="form-select">
            <option>Loading</option>
            <option>Unloading</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control" rows="3"></textarea>
    </div>

    <button type="submit" class="btn btn-success">Submit Booking</button>
</form>

<script>
    // Auto-submit the date form when the date changes
    document.getElementById("dateInput").addEventListener("change", function() {
        document.getElementById("dateForm").submit();
    });
</script>

{% endblock %}
